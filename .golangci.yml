version: "2"

run:
  # The default timeout is 1m, which can be too short for larger projects or CI environments.
  timeout: 5m
  # Exit with code 1 on errors, 0 on success. Matches your pipeline needs.
  issues-exit-code: 1
  # Include test files in the linting process.
  tests: true

# 1. Formatters have a dedicated layout section in version "2"
formatters:
  enable:
    - gofumpt        # Managed here as a native formatting tool instead of a linter
  settings:
    gofumpt:
      extra:
        group-params: true # Clears the "extra-rules" deprecation warning

# 2. Main static analysis tools engine
linters:
  enable:
    - copyloopvar
    - decorder
    # - depguard
    - errcheck
    - errorlint
    - exhaustive
    # - gocritic
    - gosec
    - govet
    - misspell
    # - nolintlint
    # - predeclared
    # - reassign
    # - revive
    # - staticcheck
    # - testifylint
    # - thelper
    # - unconvert
    # - unparam
    # - unused
    # - usestdlibvars
    # - usetesting
    # - wastedassign
    # - whitespace
  exclusions:
    paths:
      - third_party

# 3. Settings for standard linters only
linters-settings:
  gosec:
    # Exclude certain rules if they become too noisy
    excludes:
      - G115
      - G402
      - G404
      - G104
      - G304
